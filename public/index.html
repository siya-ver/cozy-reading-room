<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Treehouse</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,800;1,9..144,400&family=Nunito:wght@500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="room.css" />
</head>
<body data-time="evening">

  <main class="room" id="room" aria-label="The reading nook">

    <!-- ===== wall ===== -->
    <div class="wall">
      <div class="window" id="window" title="Change the time of day">
        <div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div>
        <div class="branch"></div>
        <div class="sill"></div>
      </div>

      <!-- bound issues live here -->
      <section class="rack" aria-label="Bound issues">
        <div class="rack-slots" id="rack"></div>
        <div class="rack-bar"></div>
        <p class="rack-label" id="rack-label"></p>
      </section>

      <div class="lamp" id="lamp" title="Lamp">
        <div class="glow"></div>
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
      </div>

      <!-- the editor's desk, under the lamp -->
      <section class="desk" aria-label="The editor's desk">
        <div class="reader-figure" id="figure">
          <div class="hair-back"></div>
          <div class="head">
            <div class="hair"></div>
            <div class="bun"></div>
            <div class="headphones"></div>
            <div class="eye l"></div><div class="eye r"></div>
          </div>
          <div class="body"></div>
          <div class="arm"></div>
        </div>
        <div class="desk-top">
          <button class="draft" id="draft" type="button" title="The issue in progress">
            <span class="draft-n" id="draft-n"></span>
            <span class="draft-count" id="draft-count"></span>
          </button>
          <div class="nameplate" id="nameplate" title="Name your reader">
            <span id="name-text">Name me</span>
          </div>
          <div class="desk-mug"></div>
        </div>
        <div class="desk-legs"><span></span><span></span></div>
      </section>
    </div>

    <!-- ===== floor ===== -->
    <div class="floor">
      <div class="rug"></div>

      <section class="table" aria-label="Unread articles">
        <div class="table-top">
          <div class="pile" id="pile"></div>
        </div>
        <div class="table-edge"></div>
        <div class="table-legs"><span></span><span></span></div>
      </section>

      <div class="plant"><div class="pot"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div></div>
    </div>

    <!-- ===== chrome ===== -->
    <header class="hud">
      <p class="hud-where">The Treehouse</p>
      <h1>Reading Nook</h1>
      <p id="hud-status">…</p>
    </header>

    <nav class="rooms" id="rooms" aria-label="Rooms of the treehouse"></nav>

    <div class="hud-actions">
      <button class="btn" id="btn-random" type="button">Draw one from the pile</button>
    </div>

    <div class="empty" id="empty" hidden>
      <p>The table is clear.</p>
      <p class="hint">Save something with the extension, or run <code>npm run seed</code> for a few essays.</p>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>

  <!-- ===== reading sheet ===== -->
  <div class="reader" id="reader" hidden>
    <div class="backdrop" id="reader-close-bg"></div>
    <article class="sheet" id="sheet">
      <div class="ribbon" id="ribbon" aria-hidden="true"></div>
      <header class="sheet-head">
        <button class="sheet-close" id="reader-close" type="button">Put it down</button>
        <p class="sheet-source" id="r-source"></p>
        <h2 class="sheet-title" id="r-title"></h2>
        <p class="sheet-byline" id="r-byline"></p>
        <p class="sheet-highlight" id="r-highlight" hidden></p>
      </header>
      <div class="sheet-body" id="r-body"></div>
      <footer class="sheet-foot">
        <label class="note">
          <span>A line for the margin</span>
          <textarea id="r-note" rows="2" placeholder="What stayed with you?"></textarea>
        </label>
        <div class="sheet-actions">
          <button class="btn ghost" id="btn-fav" type="button">Keep near</button>
          <a class="btn ghost" id="r-link" href="#" target="_blank" rel="noopener">Read the original</a>
          <button class="btn" id="btn-done" type="button">Finished, send to the editor</button>
        </div>
      </footer>
    </article>
  </div>

  <!-- ===== newspaper issue ===== -->
  <div class="issue" id="issue" hidden>
    <div class="backdrop" id="issue-close-bg"></div>
    <article class="paper-sheet" id="paper-sheet">
      <button class="sheet-close" id="issue-close" type="button">Fold it up</button>
      <header class="masthead">
        <div class="masthead-rule"></div>
        <h2 class="masthead-name" id="p-name" title="Click to rename your paper" tabindex="0"></h2>
        <div class="masthead-rule"></div>
        <p class="masthead-meta"><span id="p-issue"></span><span id="p-date"></span><span id="p-editor"></span></p>
      </header>
      <div class="front" id="front"></div>
    </article>
  </div>

  <script src="room.js"></script>
</body>
</html>
